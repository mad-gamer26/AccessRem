# /etc/nginx/conf.d/accessrem.mad-gamer.com.conf on mad-gamer.com.
# Follows that server's conventions: the shared wildcard TLS snippet.
# Installed by Deploy-Site.ps1, with install.ps1 in /var/www/accessrem.
#
#   irm https://accessrem.mad-gamer.com | iex
#
# serves the Windows installer. A web browser visiting the site is sent to
# the project on GitHub instead; /install.ps1 always serves the script, so
# anyone can read it before running it.

# conf.d files are included in the http block, where map belongs. The first
# matching regex wins: PowerShell's user agent also contains "Mozilla".
map $http_user_agent $accessrem_browser {
    default        0;
    "~*PowerShell" 0;
    "~*Mozilla"    1;
}

server {
    listen 80;
    listen [::]:80;
    server_name accessrem.mad-gamer.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name accessrem.mad-gamer.com;

    include /etc/nginx/snippets/ssl-wildcard.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = / {
        if ($accessrem_browser) {
            return 302 https://github.com/mad-gamer26/AccessRem;
        }
        rewrite ^ /install.ps1 last;
    }

    # Plain text, never cached, so a fixed script reaches people at once.
    # add_header here replaces the server's, so HSTS is repeated.
    location = /install.ps1 {
        alias /var/www/accessrem/install.ps1;
        types { }
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        return 404;
    }
}
